name: 百度网盘自动签到

on:
  schedule:
    - cron: '17 1 * * *'   # 北京时间 09:17
    - cron: '17 13 * * *'  # 北京时间 21:17
  workflow_dispatch:

concurrency:
  group: baidu-pan-signin
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  signin:
    runs-on: ubuntu-latest
    environment: user
    timeout-minutes: 10
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 准备 Node 环境
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 执行签到
        env:
          BAIDU_COOKIE: ${{ secrets.BAIDU_COOKIE }}
        run: |
          set +e
          node scripts/baidu-signin.js 2>&1 | tee signin-raw.txt
          CODE=${PIPESTATUS[0]}
          echo "SIGN_CODE=$CODE" >> $GITHUB_ENV
          if [ "$CODE" = "0" ]; then
            echo "SIGN_STATUS=✅ 成功" >> $GITHUB_ENV
          else
            echo "SIGN_STATUS=❌ 失败" >> $GITHUB_ENV
          fi
          grep -v '^::' signin-raw.txt > signin-message.txt || true

      - name: Server 酱推送
        if: always()
        env:
          SENDKEY: ${{ secrets.SENDKEY }}
        run: |
          if [ -z "$SENDKEY" ]; then
            echo "未配置 SENDKEY，跳过推送"
            exit 0
          fi
          curl -sS -X POST "https://sctapi.ftqq.com/${SENDKEY}.send" \
            --data-urlencode "title=百度网盘签到 $(TZ=Asia/Shanghai date +%F) ${{ env.SIGN_STATUS }}" \
            --data-urlencode "desp@signin-message.txt"

      - name: 结果判定
        if: always()
        run: |
          if [ "${{ env.SIGN_CODE }}" != "0" ]; then
            echo "签到未成功，标记工作流失败（触发 GitHub 邮件通知）"
            exit 1
          fi
